<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FleaMarket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans JP", sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    /* ヘッダー */
    header {
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #ff4b6e;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: #f7f7f7;
    }

    .header-button {
      padding: 10px 16px;
      border: none;
      border-radius: 7px;
      background: #ff4b6e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* カテゴリー */
    .categories {
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .category-inner {
      max-width: 1100px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      gap: 25px;
      overflow-x: auto;
    }

    .category {
      white-space: nowrap;
      cursor: pointer;
      color: #555;
    }

    .category:hover {
      color: #ff4b6e;
    }

    /* メイン */
    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .hero {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .hero h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .hero p {
      color: #777;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    /* 商品一覧 */
    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .likes {
      margin-top: 6px;
      font-size: 13px;
      color: #888;
    }

    /* フッター */
    footer {
      margin-top: 60px;
      padding: 30px;
      text-align: center;
      background: #333;
      color: white;
    }

    /* スマホ */
    @media (max-width: 700px) {

      .header-inner {
        flex-wrap: wrap;
        gap: 10px;
      }

      .logo {
        width: 100%;
      }

      .search {
        width: 100%;
      }

      .header-button {
        width: 100%;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero {
        padding: 20px;
      }

      .hero h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-inner">

      <div class="logo">
        FleaMarket
      </div>

      <input
        class="search"
        type="text"
        placeholder="商品を検索"
      >

      <button class="header-button">
        出品する
      </button>

    </div>
  </header>


  <!-- カテゴリー -->
  <nav class="categories">
    <div class="category-inner">

      <div class="category">すべて</div>
      <div class="category">レディース</div>
      <div class="category">メンズ</div>
      <div class="category">靴</div>
      <div class="category">バッグ</div>
      <div class="category">家電</div>
      <div class="category">ゲーム</div>
      <div class="category">本・漫画</div>
      <div class="category">その他</div>

    </div>
  </nav>


  <!-- メイン -->
  <main>

    <section class="hero">

      <p>
        みんなで楽しむフリーマーケット。
        気になる商品を見つけよう。
      </p>
    </section>


    <h2 class="section-title">
      おすすめの商品
    </h2>


    <!-- 商品 -->
    <div class="products">

      <div class="product">
        <div class="product-image">👟</div>
        <div class="product-info">
          <div class="product-name">
            スニーカー
          </div>
          <div class="price">
            ¥5,000
          </div>
          <div class="likes">
            ♡ 12
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">👜</div>
        <div class="product-info">
          <div class="product-name">
            レディースバッグ
          </div>
          <div class="price">
            ¥3,500
          </div>
          <div class="likes">
            ♡ 8
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">🎮</div>
        <div class="product-info">
          <div class="product-name">
            ゲーム機
          </div>
          <div class="price">
            ¥18,000
          </div>
          <div class="likes">
            ♡ 25
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">📷</div>
        <div class="product-info">
          <div class="product-name">
            デジタルカメラ
          </div>
          <div class="price">
            ¥12,800
          </div>
          <div class="likes">
            ♡ 16
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">🎧</div>
        <div class="product-info">
          <div class="product-name">
            ワイヤレスイヤホン
          </div>
          <div class="price">
            ¥4,200
          </div>
          <div class="likes">
            ♡ 19
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">👕</div>
        <div class="product-info">
          <div class="product-name">
            Tシャツ
          </div>
          <div class="price">
            ¥2,000
          </div>
          <div class="likes">
            ♡ 7
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">⌚</div>
        <div class="product-info">
          <div class="product-name">
            腕時計
          </div>
          <div class="price">
            ¥8,900
          </div>
          <div class="likes">
            ♡ 31
          </div>
        </div>
      </div>


      <div class="product">
        <div class="product-image">📚</div>
        <div class="product-info">
          <div class="product-name">
            人気の漫画セット
          </div>
          <div class="price">
            ¥3,800
          </div>
          <div class="likes">
            ♡ 14
          </div>
        </div>
      </div>

    </div>

  </main>


  <!-- フッター -->
  <footer>
    © 2026 FleaMarket
  </footer>

</body>
</html>
